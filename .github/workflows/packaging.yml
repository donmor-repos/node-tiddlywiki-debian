# .github/workflows/packaging.yml
name: NPM -> Deb Packaging

on:
  schedule:
    - cron: '0 0 * * *'    
  workflow_dispatch:
    inputs:
      ref:
        description: 'NPM package version (e.g., 1.2.3). Leave empty to auto-pick the smallest missing version.'
        required: false
        default: ''

env:
  NPM_PACKAGE_NAME: 'tiddlywiki'
  DEB_SOURCE_PACKAGE: 'node-tiddlywiki'
  DEB_BINARY_PACKAGE: 'node-tiddlywiki'

jobs:
  build-and-release:
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          fetch-tags: true

      - name: Determine target version (ref)
        id: version
        run: |
          if [ -n "${{ github.event.inputs.ref }}" ]; then
            REF="${{ github.event.inputs.ref }}"
            echo "Using manually specified ref: $REF"
          else
            VERSIONS=$(npm view "${{ env.NPM_PACKAGE_NAME }}" versions --json 2>/dev/null | jq -r '.[]' | \
                grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V)
            TAGS=$(git tag | sort -V)
            MISSING=$(comm -23 <(echo "$VERSIONS") <(echo "$TAGS") | sort -V)
            if [ -z "$MISSING" ]; then
              echo "No missing versions found. Nothing to do."
              exit 0
            fi
            REF=$(echo "$MISSING" | head -n1)
            echo "Auto-selected missing version: $REF"
          fi
          echo "ref=$REF" >> $GITHUB_OUTPUT

      - name: Download NPM package tarball
        if: steps.version.outputs.ref != ''
        run: |
          npm pack "${{ env.NPM_PACKAGE_NAME }}@${{ steps.version.outputs.ref }}"
          TGZ_FILE=$(ls *.tgz | head -n1)
          mv "$TGZ_FILE" "../${{ env.DEB_SOURCE_PACKAGE }}_${{ steps.version.outputs.ref }}.orig.tar.gz"

      - name: Extract upstream source
        if: steps.version.outputs.ref != ''
        run: |
          rm .github/workflows/packaging.yml LICENSE README.md
          tar xvf "../${{ env.DEB_SOURCE_PACKAGE }}_${{ steps.version.outputs.ref }}.orig.tar.gz" --strip-components=1

      - name: Install build dependencies
        if: steps.version.outputs.ref != ''
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends apt-utils build-essential devscripts dh-nodejs

      - name: Update Debian changelog
        if: steps.version.outputs.ref != ''
        run: |
          export DEBFULLNAME="donmor"
          export DEBEMAIL="donmor3000@hotmail.com"
          dch -v "${{ steps.version.outputs.ref }}-1" "Version number update for ${{ steps.version.outputs.ref }}."
          dch -r "node-tiddlywiki"

      - name: Build Debian package
        if: steps.version.outputs.ref != ''
        run: |
          dpkg-buildpackage -us -uc

      - name: Verify Debian package
        if: steps.version.outputs.ref != ''
        run: |
          DEB_FILE=$(ls ../*.deb | head -n1)
          echo "Verifying $DEB_FILE"
          dpkg-deb -I "$DEB_FILE"
          dpkg-deb -c "$DEB_FILE"
          sudo dpkg -i --dry-run "$DEB_FILE"
          echo "Package verification passed."

      - name: Commit changelog
        if: steps.version.outputs.ref != ''
        id: commit
        uses: iarekylew00t/verified-bot-commit@v2
        with:
          message: "add ${{ steps.version.outputs.ref }}"
          files: |
            debian/changelog

      - name: Create and push tag
        if: steps.version.outputs.ref != ''
        uses: rickstaa/action-create-tag@v1
        with:
          tag: "${{ steps.version.outputs.ref }}"
          commit_sha: "${{ steps.commit.outputs.ref }}"
          gpg_private_key: "${{ secrets.GPG_KEY }}"

      - name: Get previous Packages
        if: steps.version.outputs.ref != ''
        continue-on-error: true
        uses: robinraju/release-downloader@v1
        with:
          latest: true
          out-file-path: download/${{ steps.version.outputs.ref }}
          fileName: 'Packages'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get previous Sources
        if: steps.version.outputs.ref != ''
        continue-on-error: true
        uses: robinraju/release-downloader@v1
        with:
          latest: true
          out-file-path: download/${{ steps.version.outputs.ref }}
          fileName: 'Sources'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create upload dir
        if: steps.version.outputs.ref != ''
        run: |
          mkdir -p download/${{ steps.version.outputs.ref }}

      - name: Create repo
        if: steps.version.outputs.ref != ''
        working-directory: download/${{ steps.version.outputs.ref }}
        run: |
          mv ../../../*.deb ../../../*.gz ../../../*.xz ../../../*.dsc ./
          dpkg-scanpackages -m ../../download/${{ steps.version.outputs.ref }} >> Packages
          dpkg-scansources ../../download/${{ steps.version.outputs.ref }} >> Sources
          apt-ftparchive release . > Release
          echo "${{ secrets.GPG_KEY }}" | gpg --batch --import
          gpg --batch --yes --clearsign --local-user ${{ secrets.GPG_KEY_FINGERPRINT }} --output InRelease Release

      - name: Create release
        if: steps.version.outputs.ref != ''
        uses: softprops/action-gh-release@v3
        with:
          body: "Version number update for ${{ steps.version.outputs.ref }}."
          tag_name: ${{ steps.version.outputs.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          make_latest: "true"
          working_directory: download/${{ steps.version.outputs.ref }}
          files: |
            *.deb
            *.gz
            *.xz
            *.dsc
            InRelease
            Sources
            Packages
